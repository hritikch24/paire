<script type="application/ld+json">[{"@context":"https://schema.org","@type":"WebPage","name":"What's your dating vibe? A 1-minute quiz","url":"%SITE_URL%/vibe-quiz/","inLanguage":"en-IN","isPartOf":{"@id":"%SITE_URL%/#website"},"description":"Six quick questions to find your dating vibe and the vibe you click with. Free, no sign-up; answers stay in your browser."}]</script>
<style>
.quiz{padding:40px 0 80px}.quiz-card{max-width:640px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:28px;padding:32px;box-shadow:0 18px 50px #35101d12}
.quiz h1{font-size:clamp(34px,6vw,56px);line-height:1.05;letter-spacing:-2px;margin:8px 0 12px}.quiz h1 em{font-style:normal;color:var(--rose)}
.quiz-progress{height:6px;background:var(--peach);border-radius:9px;overflow:hidden;margin:18px 0 22px}.quiz-progress span{display:block;height:100%;width:0;background:var(--rose);transition:width .35s ease}
.quiz-q{font-size:22px;font-weight:700;line-height:1.3;margin:0 0 16px}.quiz-options{display:grid;gap:10px}
.quiz-options button{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:14px 16px;border-radius:16px;border:1px solid var(--line);background:var(--paper);color:var(--ink);transition:transform .15s,border-color .15s,background .15s;min-height:52px}
.quiz-options button:hover{border-color:var(--rose);transform:translateY(-1px)}.quiz-options button:active{transform:scale(.98)}.quiz-options .emoji{font-size:22px}
.quiz-result{text-align:center}.quiz-result .big{font-size:72px;line-height:1;margin:6px 0 4px;animation:pop .5s ease}.quiz-result h2{font-size:clamp(28px,5vw,40px);letter-spacing:-1px;margin:6px 0 10px}
.quiz-result .facts{display:grid;gap:10px;margin:20px 0;text-align:left}.quiz-result .facts div{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:12px 14px}.quiz-result .facts strong{display:block;font-size:12px;letter-spacing:1px;color:var(--rose)}
.quiz-actions{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:18px}.ghost{display:inline-flex;align-items:center;gap:8px;padding:14px 20px;border-radius:99px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:14px}
.quiz-start{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.fine{font-size:13px;color:var(--muted)}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@media (max-width:640px){.quiz-card{padding:22px;border-radius:22px}.quiz{padding:16px 0 56px}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="nav wrap"><a class="wordmark" href="/app/" aria-label="Paire home">paire<span>.</span></a><nav aria-label="Main"><a href="/vibe-quiz/">Vibe quiz</a><a href="/#sparks">Sparks</a><a href="/#comfort">Her rules</a><a href="/#vibe">The vibe</a><a href="/#passes">Pricing</a><a href="/#faq">FAQ</a></nav><a class="button small" href="/app/">Open Paire <span aria-hidden="true">↗</span></a></header>
<main id="main" class="quiz wrap">
<div class="quiz-card" id="quiz" aria-live="polite">
  <noscript><p>This quiz needs JavaScript. You can still <a href="/app/">find your Paire</a>.</p></noscript>
</div>
<p class="fine" style="text-align:center;margin-top:18px">Just for fun. No sign-up, and your answers never leave your browser.</p>
</main>
<footer class="wrap"><div><a class="wordmark" href="/app/">paire<span>.</span></a></div></footer>
<script>
(function () {
  var TYPES = {
    cozy: { emoji: "☕", name: "Cozy Romantic", line: "Slow mornings, long talks and the second cup that turns into a third.", date: "Tea or coffee at sunset, then a long walk with nowhere to be.", green: "Remembers how you take your tea.", click: "movie" },
    night: { emoji: "🌙", name: "Midnight Philosopher", line: "You fall for minds first. Small talk bores you; 2 a.m. conversations don't.", date: "A quiet café, a bookshop crawl, or stargazing on a rooftop.", green: "Asks a question nobody has asked you before.", click: "cozy" },
    spark: { emoji: "🏔️", name: "Adventure Spark", line: "Plans are suggestions. You'd rather do something than talk about doing it.", date: "A sunrise trek, go-karting, or a street-food crawl in a new neighbourhood.", green: "Says yes to a plan made five minutes ago.", click: "night" },
    movie: { emoji: "🎬", name: "Movie Dreamer", line: "Grand gestures, the perfect song and a little bit of drama: you believe in the movie moment.", date: "A rain-soaked drive with the right playlist, or a late show with too much popcorn.", green: "Sends you a song that says what they can't.", click: "spark" }
  };
  var QUESTIONS = [
    { q: "Your ideal Sunday starts with…", a: [["☕", "Tea on the balcony, no phone", "cozy"], ["📚", "A book that keeps you up past midnight", "night"], ["🏞️", "A 6 a.m. drive somewhere new", "spark"], ["🎶", "Your favourite playlist, loud", "movie"]] },
    { q: "Pick a first-date plan:", a: [["🫖", "A cosy café and a long walk", "cozy"], ["🔭", "Rooftop, stars and deep questions", "night"], ["🛵", "A street-food crawl across the city", "spark"], ["🌧️", "A drive in the rain with the perfect song", "movie"]] },
    { q: "Your love language is mostly…", a: [["🤲", "Quiet acts of care", "cozy"], ["💬", "Conversations that go somewhere", "night"], ["🎟️", "Shared adventures", "spark"], ["💐", "Big, sweet gestures", "movie"]] },
    { q: "A match texts at 1 a.m. You…", a: [["😴", "Reply at 8 with a good-morning", "cozy"], ["🌙", "Are already awake, let's talk about life", "night"], ["🚗", "Suggest a late-night noodle run", "spark"], ["📝", "Send a voice note with a song lyric", "movie"]] },
    { q: "Your friends describe you as…", a: [["🏡", "The calm one everyone calls", "cozy"], ["🧠", "The one with opinions on everything", "night"], ["⚡", "The one who's always up for it", "spark"], ["✨", "The hopeless romantic", "movie"]] },
    { q: "The green flag that gets you every time:", a: [["🫶", "They remember the little things", "cozy"], ["🤔", "They ask great questions", "night"], ["😄", "They make ordinary days fun", "spark"], ["🎁", "They plan surprises", "movie"]] }
  ];
  var root = document.getElementById("quiz");
  var scores, step;
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }
  function intro() {
    root.innerHTML = '<p class="eyebrow">1-MINUTE QUIZ · FREE · NO SIGN-UP</p><h1>What’s your <em>dating vibe?</em></h1><p>Six quick questions. Find out if you’re a Cozy Romantic, a Midnight Philosopher, an Adventure Spark or a Movie Dreamer, and which vibe you click with.</p><div class="quiz-start"><button class="button" id="quiz-go" type="button">Start the quiz <span aria-hidden="true">→</span></button></div>';
    document.getElementById("quiz-go").onclick = start;
  }
  function start() { scores = { cozy: 0, night: 0, spark: 0, movie: 0 }; step = 0; ask(); }
  function ask() {
    var item = QUESTIONS[step];
    var html = '<p class="eyebrow">QUESTION ' + (step + 1) + ' OF ' + QUESTIONS.length + '</p><div class="quiz-progress" aria-hidden="true"><span style="width:' + (step / QUESTIONS.length) * 100 + '%"></span></div><p class="quiz-q">' + esc(item.q) + '</p><div class="quiz-options">';
    item.a.forEach(function (option, index) { html += '<button type="button" data-i="' + index + '"><span class="emoji" aria-hidden="true">' + option[0] + '</span><span>' + esc(option[1]) + '</span></button>'; });
    root.innerHTML = html + '</div>';
    root.querySelectorAll(".quiz-options button").forEach(function (button) {
      button.onclick = function () {
        scores[item.a[Number(button.getAttribute("data-i"))][2]] += 1;
        step += 1;
        if (step < QUESTIONS.length) ask(); else show(winner(), true);
      };
    });
    var first = root.querySelector(".quiz-options button"); if (first) first.focus({ preventScroll: true });
  }
  function winner() {
    // Ties go to the answer given last among the leaders, so every result is reachable.
    var best = "cozy"; Object.keys(scores).forEach(function (key) { if (scores[key] >= scores[best]) best = key; });
    return best;
  }
  function shareUrl(key) { return location.origin + "/vibe-quiz/?r=" + key; }
  function show(key, mine) {
    var type = TYPES[key], partner = TYPES[type.click];
    var text = "I'm a " + type.emoji + " " + type.name + "! What's your dating vibe? Take the 1-minute quiz:";
    root.innerHTML = '<div class="quiz-result"><p class="eyebrow">' + (mine ? "YOUR DATING VIBE" : "A FRIEND’S DATING VIBE") + '</p><div class="big" aria-hidden="true">' + type.emoji + '</div><h2>' + esc(type.name) + '</h2><p>' + esc(type.line) + '</p>' +
      '<div class="facts"><div><strong>YOUR PERFECT FIRST DATE</strong>' + esc(type.date) + '</div><div><strong>THE GREEN FLAG YOU FALL FOR</strong>' + esc(type.green) + '</div><div><strong>YOU CLICK WITH</strong>' + partner.emoji + ' ' + esc(partner.name) + '</div></div>' +
      '<div class="quiz-actions"><a class="button" href="/app/?utm_source=vibe-quiz">Find your ' + esc(partner.name) + ' on Paire <span aria-hidden="true">↗</span></a></div>' +
      '<div class="quiz-actions">' + (mine ? '<a class="ghost" id="quiz-wa" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent(text + " " + shareUrl(key)) + '">Share on WhatsApp</a><button class="ghost" type="button" id="quiz-share">Share or copy link</button>' : '') + '<button class="ghost" type="button" id="quiz-again">' + (mine ? "Take it again" : "Take the quiz") + '</button></div>' +
      '<p class="fine" id="quiz-note" role="status"></p></div>';
    document.getElementById("quiz-again").onclick = start;
    var share = document.getElementById("quiz-share");
    if (share) share.onclick = function () {
      var url = shareUrl(key), note = document.getElementById("quiz-note");
      if (navigator.share) { navigator.share({ title: "What's your dating vibe?", text: text, url: url }).catch(function () {}); return; }
      (navigator.clipboard ? navigator.clipboard.writeText(url) : Promise.reject()).then(function () { note.textContent = "Link copied. Send it to your group chat!"; }, function () { note.textContent = url; });
    };
    if (mine && history.replaceState) history.replaceState(null, "", "/vibe-quiz/?r=" + key);
  }
  var shared = new URLSearchParams(location.search).get("r");
  if (shared && TYPES[shared]) show(shared, false); else intro();
})();
</script>
<script src="/site.js"></script>
</body>
