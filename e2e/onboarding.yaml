# New member signs in (seeded account without a profile) and completes sign-up (skipping the optional photo).
appId: com.muse.app
---
- launchApp:
    clearState: true
- waitForAnimationToEnd
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: "muse+onboard@example.com"
- extendedWaitUntil:
    visible: "The basics"
    timeout: 30000
- tapOn:
    id: "basics-name"
- inputText: "Riley"
- hideKeyboard
- tapOn:
    id: "basics-birthday"
- inputText: "02041998"
# iOS number-pad has no Return/Done key; tap form background to dismiss it.
- tapOn: "The basics"
- scrollUntilVisible:
    element:
      id: "gender-woman"
    direction: DOWN
    centerElement: true
- takeScreenshot: codex-artifacts/delhi-ncr-ui/14-onboarding-basics
- tapOn:
    id: "gender-woman"
- scrollUntilVisible:
    element:
      id: "showme-everyone"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "showme-everyone"
- tapOn:
    id: "basics-continue"
- extendedWaitUntil:
    visible: "Add a photo"
    timeout: 30000
- tapOn:
    id: "photos-skip"
- extendedWaitUntil:
    visible: "What are you into?"
    timeout: 30000
- tapOn:
    id: "interest-soundscape"
- tapOn:
    id: "interest-frame"
- scrollUntilVisible:
    element:
      id: "intention-long-term"
    direction: DOWN
- tapOn:
    id: "intention-long-term"
- scrollUntilVisible:
    element:
      id: "onboarding-casual"
    direction: DOWN
- tapOn:
    id: "onboarding-casual"
- tapOn:
    id: "interests-continue"
- extendedWaitUntil:
    visible:
      id: "tab-discover"
    timeout: 30000
- assertVisible: "A little spark starts here."
