appId: com.muse.app
---
- launchApp:
    clearState: true
- assertVisible: "Welcome back"
- tapOn:
    id: "auth-email"
- inputText: "muse+alexa@example.com"
- tapOn:
    id: "auth-password"
- inputText: "Password123!"
- tapOn:
    id: "auth-continue"
- tapOn:
    text: "Not Now"
    optional: true
- assertVisible: "Discover"
