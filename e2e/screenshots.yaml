# Captures the main screens (visual QA and Play listing drafts). Not part of the default E2E run.
appId: com.muse.app
---
- launchApp:
    clearState: true
- takeScreenshot: 01-welcome
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: "muse+dev@example.com"
- extendedWaitUntil:
    visible:
      id: "discover-like"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 5000
- takeScreenshot: 02-discover
- tapOn: "Alexa, 28"
- extendedWaitUntil:
    visible:
      id: "profile-close"
    timeout: 20000
- takeScreenshot: 03-profile-view
- scroll
- takeScreenshot: 04-profile-view-details
- tapOn:
    id: "profile-close"
- tapOn:
    id: "tab-matches"
- takeScreenshot: 05-matches
- tapOn:
    id: "tab-profile"
- takeScreenshot: 06-profile
- tapOn:
    id: "profile-settings"
- takeScreenshot: 07-settings
- scroll
- takeScreenshot: 08-settings-account
