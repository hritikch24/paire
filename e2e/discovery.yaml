# Dev likes profiles in Discover. Casey liked Dev in the seed data, so liking her back is a real match.
appId: com.muse.app
---
- launchApp:
    clearState: true
- waitForAnimationToEnd
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: "muse+dev@example.com"
- extendedWaitUntil:
    visible:
      id: "discover-like"
    timeout: 60000
- tapOn:
    id: "discover-like"
- tapOn:
    id: "match-keep-swiping"
    optional: true
- tapOn:
    id: "discover-like"
    optional: true
- extendedWaitUntil:
    visible: "It's a match!"
    timeout: 20000
- tapOn:
    id: "match-message"
- extendedWaitUntil:
    visible:
      id: "chat-input"
    timeout: 20000
