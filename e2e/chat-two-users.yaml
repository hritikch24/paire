appId: com.muse.app
---
- launchApp:
    clearState: true
- assertVisible: "Welcome back"
- tapOn:
    id: "auth-email"
- inputText: "muse+jules@example.com"
- tapOn:
    id: "auth-password"
- inputText: "Password123!"
- tapOn:
    id: "auth-continue"
- tapOn:
    text: "Not Now"
    optional: true
- tapOn:
    id: "tab-matches"
- tapOn:
    text: "Matches"
    optional: true
- assertVisible:
    id: "matches-title"
- tapOn:
    id: "match-chat-muse_alexa_muse_jules"
- tapOn:
    id: "chat-input"
- inputText: "Hello from Jules"
- tapOn:
    id: "chat-send"
- tapOn:
    text: "Not Now"
    optional: true
- tapOn:
    text: "Chat"
    optional: true
- assertVisible:
    text: "Hello from Jules"
- tapOn:
    id: "chat-back"
- launchApp:
    clearState: true
- assertVisible: "Welcome back"
- tapOn:
    id: "auth-email"
- inputText: "muse+alexa@example.com"
- tapOn:
    id: "auth-password"
- inputText: "Password123!"
- tapOn:
    id: "auth-continue"
- tapOn:
    text: "Not Now"
    optional: true
- tapOn:
    id: "tab-matches"
- tapOn:
    text: "Matches"
    optional: true
- assertVisible:
    id: "matches-title"
- tapOn:
    id: "match-chat-muse_alexa_muse_jules"
- assertVisible:
    id: "chat-message-latest"
