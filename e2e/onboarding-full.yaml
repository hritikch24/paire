appId: com.muse.app
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Welcome back"
    timeout: 60000
- tapOn:
    id: "auth-email"
- inputText: "muse+onboard@example.com"
- tapOn:
    id: "auth-password"
- inputText: "Password123!"
- tapOn:
    id: "auth-continue"
- tapOn:
    text: "Not Now"
    optional: true
- assertVisible:
    id: "onboarding-name"
- tapOn:
    id: "onboarding-name"
- inputText: "Riley"
- tapOn:
    id: "onboarding-pronouns"
- inputText: "they/them"
- tapOn:
    id: "onboarding-age"
- inputText: "26"
- tapOn:
    id: "onboarding-city"
- inputText: "Austin"
- tapOn:
    id: "onboarding-bio"
- inputText: "Testing the Muse onboarding flow."
- hideKeyboard
- scroll
- tapOn:
    id: "onboarding-continue"
- tapOn:
    id: "onboarding-add-photo"
- extendedWaitUntil:
    visible: "Pick your Muse Cards"
    timeout: 60000
- tapOn:
    id: "interest-soundscape"
- tapOn:
    id: "onboarding-interests-continue"
- extendedWaitUntil:
    visible: "Rapid questions"
    timeout: 60000
- tapOn:
    text: "Skip for now"
- extendedWaitUntil:
    visible: "Safety first"
    timeout: 60000
- tapOn:
    text: "I agree"
- tapOn:
    id: "onboarding-finish"
- assertVisible: "Discover"
