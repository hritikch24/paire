# Alexa opens her seeded match with Jules and sends a message.
appId: com.muse.app
---
- launchApp:
    clearState: true
- waitForAnimationToEnd
- runFlow:
    file: subflows/sign-in.yaml
    env:
      EMAIL: "muse+alexa@example.com"
- extendedWaitUntil:
    visible:
      id: "tab-matches"
    timeout: 60000
- tapOn:
    id: "tab-matches"
- tapOn:
    id: "match-row-muse_alexa_muse_jules"
- extendedWaitUntil:
    visible:
      id: "chat-input"
    timeout: 20000
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "chat-message-latest"
    timeout: 20000
- runFlow: subflows/dismiss-dev-warning.yaml
- takeScreenshot: codex-artifacts/delhi-ncr-ui/11-chat-ready
- tapOn:
    id: "chat-input"
- inputText: "Hello from Maestro"
- extendedWaitUntil:
    visible:
      id: "chat-send"
      enabled: true
    timeout: 10000
- takeScreenshot: codex-artifacts/delhi-ncr-ui/12-chat-composer
- tapOn:
    id: "chat-send"
- hideKeyboard
- extendedWaitUntil:
    visible: "Hello from Maestro"
    timeout: 20000
- takeScreenshot: codex-artifacts/delhi-ncr-ui/13-chat-sent
