# React Native 0.81's development migration notice can cover bottom controls.
# Only dismiss its warning notice; application errors remain test failures.
appId: com.muse.app
---
- runFlow:
    when:
      visible: "Open debugger to view warnings."
    commands:
      - tapOn:
          text: "!.+Open debugger to view warnings."
          point: "94%,50%"
      - assertNotVisible: "Open debugger to view warnings."
